<html lang="ru">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f0f0f0;
            line-height: 1.4;
        }

        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #111111;
            --accent: #c8a87c;
            --accent-hover: #e0c09c;
            --text-light: #f5f5f5;
            --text-muted: #b0b0b0;
            --border-light: #2a2a2a;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 48px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo img {
            height: 40px;
            width: auto;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 1rem;
            cursor: pointer;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .btn {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 40px;
            margin-right: 12px;
            margin-top: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline:hover {
            background: var(--accent);
            color: #0a0a0a;
            transform: translateY(-2px);

        }

        .hero-banner {
            width: 100%;
            border-radius: 32px;
            margin-bottom: 48px;
            overflow: hidden;
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .hero-badge {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--accent);
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .hero-address {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 1rem;

        .hero-description {

            color: var(--text-muted);

            margin-right: auto;
            line-height: 1.5;

        .hero-contact {
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 20px;
            color: var(--accent);
        }

            margin-bottom: 40px;
            text-align: center;
        }

        .masters-header h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .masters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .master-card {
            background: #ffffff;
            color: #0a0a0a;
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .master-card:hover {

            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }

            height: 300px;

            background: #e0e0e0;

            margin-bottom: 8px;
            color: #0a0a0a;
        }

            color: #555;
            line-height: 1.4;
        }

        /* Галерея */

            margin-bottom: 40px;
            text-align: center;
        }

        .gallery-header h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .gallery-sub {

            font-size: 0.95rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin: 40px 0;

        .gallery-item {
            overflow: hidden;
            border-radius: 20px;
            transition: all 0.4s ease;
            background: #1a1a1a;
            cursor: pointer;
        }

        .gallery-item img {

            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

            transform: scale(1.03);
        }

        /* О нас */

            margin-bottom: 30px;
            text-align: center;

            font-size: 2rem;
            font-weight: 600;

            padding-left: 26px;
            position: relative;
            font-size: 1rem;
            line-height: 1.4;
        }

        .services-box li:before {
            content: "•";
            color: var(--accent);
            font-size: 1.3rem;
            position: absolute;
            left: 0;
            top: -2px;

            padding: 32px;

            font-weight: 600;

        .page {

            }
            to {

                transform: translateY(0);
            }
        }
                /* О нас - блок с фото и текстом */
        .about-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .about-header h2 {
            font-size: 2rem;
            font-weight: 600;
        }

        .about-block {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            align-items: center;
            background: #111;
            border-radius: 32px;
            padding: 40px;

            width: 100%;
            border-radius: 24px;
            object-fit: cover;
        }

        .about-text-right {
            flex: 1.2;
        }

        .about-creators {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .about-text-right p {
            font-size: 1rem;
            margin-bottom: 18px;
            line-height: 1.6;
            color: #ddd;
        }

        @media (max-width: 768px) {
            .about-block {
                flex-direction: column;
                padding: 24px;
            }
            .about-image {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: row;
                position: relative;
            }
            .nav-links {
                display: none;
                width: 100%;
                flex-direction: column;
                gap: 1rem;
                background: #0a0a0a;
                padding: 20px 0;
                margin-top: 20px;
                border-top: 1px solid var(--border-light);
            }
            .nav-links.active {
                display: flex;
            }
            .menu-toggle {
                display: block;
            }
            .hero-badge {
                font-size: 3rem;
            }
            .hero-title {
                font-size: 1.8rem;
            }
            .contacts-wrapper {
                flex-direction: column;
            }
            footer {
                flex-direction: column;
                gap: 20px;
                text-align: center;

            .footer-contacts {
                text-align: center;
            }
            .footer-links {
                justify-content: center;
                flex-wrap: wrap;
            }
            .masters-grid {
                grid-template-columns: 1fr;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            .about-content {
                padding: 24px;
            }
        }
    </style>
</head>

<div class="container">

                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // Роутинг
    const pages = {
        home: renderHome,
        masters: renderMasters,
        gallery: renderGallery,
        about: renderAbout,
        contacts: renderContacts
    };

    let currentPage = 'home';

    function navigateTo(page) {
        if (pages[page]) {
            currentPage = page;
            document.getElementById('app').innerHTML = pages[page]();
            // Обновляем активный класс в навигации
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('data-page') === page) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
            // Переназначаем обработчики для динамических кнопок
            attachDynamicClicks();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function attachDynamicClicks() {
        document.querySelectorAll('[data-page]').forEach(el => {
            el.removeEventListener('click', pageHandler);
            el.addEventListener('click', pageHandler);
        });
    }

    function pageHandler(e) {
        e.preventDefault();
        const page = this.getAttribute('data-page');
        if (page && pages[page]) {
            navigateTo(page);
        }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        navigateTo('home');
        // Клики по основному меню
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('data-page');
                if (page) navigateTo(page);
            });
        });
        // Клики по футеру
        document.querySelectorAll('.footer-links a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('data-page');
                if (page) navigateTo(page);
            });
        });
        // Мобильное меню
        const toggleBtn = document.getElementById('mobileMenu');
        const navLinks = document.getElementById('navLinks');
        toggleBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    });
</script>
</body>
</html>
